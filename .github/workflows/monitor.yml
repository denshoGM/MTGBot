
name: Monitor Warhammer Decks

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
        max_price:
          description: "Soglia mazzi standard (€), vuoto = 90"
          required: false
          default: ""
        max_collector_price:
          description: "Soglia Collector's (€), vuoto = 150"
          required: false
          default: ""

permissions:
  contents: read

concurrency:
  group: warhammer-price-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Run price monitor
        env:
          MAX_PRICE: ${{ inputs.max_price }}
          MAX_COLLECTOR_PRICE: ${{ inputs.max_collector_price }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CARDTRADER_TOKEN: ${{ secrets.CARDTRADER_TOKEN }}
        run: npm run monitor

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state.json
          key: state-${{ github.run_id }}
